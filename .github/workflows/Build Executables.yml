name: 构建并发布 Windows 安装包

# 完整发布闭环：打 v* tag → Windows 环境 PyInstaller 打包 → 创建 GitHub Release → 附带 zip。
# 发布后，软件内的更新自检（update_core.py）即可在该仓库的 /releases/latest 查到新版。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 v4.1.0）'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # 统一目标版本号：tag 推送用 ref_name，手动触发用输入
      TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验 tag 与源码版本号一致
        shell: pwsh
        run: |
          $tag = "$env:TARGET_TAG"
          $ver = (Select-String -Path 'src\gui\version.py' -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag  APP_VERSION=$ver"
          if ("v$ver" -ne $tag) {
            Write-Error "版本号不一致：tag 是 $tag，但 src/gui/version.py 的 APP_VERSION 是 $ver。请先统一版本号再打 tag。"
            exit 1
          }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install PySide6 pyinstaller

      # 隐私：不再注入任何内置登录态。软件不含用户账号/Cookie，
      # 三端（番茄/七猫/文库8）均由用户自行登录，会话只存本机。
      - name: PyInstaller 打包 GUI
        run: python -m PyInstaller build.spec --clean --noconfirm

      # 打包自检（#49）：httpcloak 原生库不在 package_data，collect_data_files
      # 实测返回 0 项；漏收时发布版会静默回退裸 requests、文库8全线 403，
      # 且界面无任何报错。这里用刚打出的 exe 直接验证指纹通道能否加载，
      # 失败即让构建红灯，避免再发出一个"看起来正常但文库8全废"的版本。
      # 该分支在 GUI 导入前执行，不需要显示环境或登录态。
      - name: 文库8指纹内核打包自检
        shell: pwsh
        run: |
          $exe = "dist\星隅小说下载器\GUI-novel下载器.exe"
          $report = "wenku8_selftest_result.txt"
          if (-not (Test-Path $exe)) {
            Write-Error "找不到打包产物：$exe"; exit 1
          }
          if (Test-Path $report) { Remove-Item $report -Force }
          Write-Host "运行打包自检：$exe --wenku8-selftest=$report"
          # exe 是 console=False 的 GUI 程序：& 调用不会等待其退出，
          # 必须用 Start-Process -Wait，否则报告还没写完就去读文件。
          $argList = @("--wenku8-selftest=$report")
          $proc = Start-Process -FilePath $exe -ArgumentList $argList -Wait -PassThru
          $code = $proc.ExitCode
          Write-Host "自检退出码：$code"
          if (Test-Path $report) { Get-Content $report }
          else { Write-Error "自检未生成报告文件 $report"; exit 1 }
          if ($code -ne 0) {
            Write-Error "打包自检失败：发布版 exe 里 httpcloak 指纹内核未能加载（详见上方报告）。请检查 build.spec 是否收集了 httpcloak/lib 原生库。"
            exit 1
          }
          $content = Get-Content $report -Raw
          if ($content -notmatch 'network_mode=httpcloak') {
            Write-Error "打包自检失败：报告里 network_mode 不是 httpcloak。$content"
            exit 1
          }
          Write-Host "打包自检通过：network_mode=httpcloak"

      - name: 生成绿色版压缩包
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\星隅小说下载器\*" -DestinationPath "_Windows_$env:TARGET_TAG.zip" -Force

      - name: 创建 GitHub Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: ${{ env.TARGET_TAG }}
          generate_release_notes: true
          body: |
            ## GUI-novel下载器 ${{ env.TARGET_TAG }}

            从源码自动构建的 Windows 绿色版，解压后运行「GUI-novel下载器.exe」即可。

            ### 本次更新
            详见更新说明；安装后软件内「设置 → 检查更新」也会展示本 Release 说明。

            > 仅供个人学习研究使用，请遵守当地法律法规。
          files: |
            _Windows_${{ env.TARGET_TAG }}.zip
