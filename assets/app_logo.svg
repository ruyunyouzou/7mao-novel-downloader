<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFE082"/><stop offset="0.5" stop-color="#FFC107"/><stop offset="1" stop-color="#FF8F00"/>
  </linearGradient>
  <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF5252"/><stop offset="1" stop-color="#D50000"/>
  </linearGradient>
  <linearGradient id="eye" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF176"/><stop offset="0.6" stop-color="#FFD600"/><stop offset="1" stop-color="#FF8F00"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3A2400" flood-opacity="0.4"/>
  </filter>
</defs>
<rect x="6" y="6" width="244" height="244" rx="58" fill="url(#bg)"/>
<rect x="6" y="6" width="244" height="244" rx="58" fill="url(#gloss)"/>
<rect x="7.5" y="7.5" width="241" height="241" rx="56.5" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2"/>

  <g filter="url(#soft)" fill="#2A1A10">
    <path d="M 48 104 L 60 34 L 108 74 Z"/>
    <path d="M 148 74 L 196 30 L 208 104 Z"/>
    <path d="M 58 82 L 70 70 L 200 70 L 212 82 L 212 98 L 200 110 L 70 110 L 58 98 Z"/>
    <path d="M 212 86 L 218 94 L 162 212 Q 158 224 142 224 L 118 224 Q 104 224 110 210 L 152 104 Q 156 92 168 92 L 200 92 Z"/>
  </g>

  <g filter="url(#glow)" opacity="0.8">
    <path d="M 66 70 L 126 92 L 118 102 L 74 88 Z" fill="url(#eye)" opacity="0.5"/>
    <path d="M 204 70 L 144 92 L 152 102 L 196 88 Z" fill="url(#eye)" opacity="0.5"/>
  </g>
  <!-- 左眼：外端尖角(66,70)向左上挑，内端(126,94)靠鼻子且低 -->
  <path d="M 66 70 L 128 92 L 120 103 L 74 88 Z" fill="url(#eye)"/>
  <path d="M 204 70 L 142 92 L 150 103 L 196 88 Z" fill="url(#eye)"/>
  <!-- 上眼睑高光刃（锐利白线，沿外挑方向） -->
  <path d="M 68 72 L 126 92" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="square" opacity="0.9"/>
  <path d="M 202 72 L 144 92" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="square" opacity="0.9"/>
  <!-- 竖瞳：锐利菱形（置于眼中部） -->
  <path d="M 92 80 L 98 84 L 95 98 L 89 93 Z" fill="#3A2400"/>
  <path d="M 168 80 L 162 84 L 165 98 L 171 93 Z" fill="#3A2400"/>
  <!-- 外眼角刃延长线（继续向两侧外上方挑出） -->
  <path d="M 66 70 L 46 56" fill="none" stroke="#FFC107" stroke-width="3.2" stroke-linecap="square" opacity="0.9"/>
  <path d="M 204 70 L 224 56" fill="none" stroke="#FFC107" stroke-width="3.2" stroke-linecap="square" opacity="0.9"/>

  <path d="M 120 112 L 138 112 L 129 122 Z" fill="#2A1606"/>
  <path d="M 112 118 L 129 126 L 146 118" fill="none" stroke="#2A1606" stroke-width="4" stroke-linejoin="miter" stroke-linecap="square"/>
  <path d="M 118 124 L 123 136 L 127 125 Z" fill="#FFFFFF"/>
  <path d="M 131 125 L 135 136 L 140 124 Z" fill="#FFFFFF"/>
  <g stroke="#2A1606" stroke-width="4" stroke-linecap="square">
    <path d="M 58 88 L 16 74"/><path d="M 58 100 L 14 104"/>
    <path d="M 212 88 L 254 74"/><path d="M 212 100 L 256 104"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="204" cy="204" r="40" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="204" cy="204" r="34" fill="url(#badge)"/>
    <path d="M 204 185 L 204 215 M 189 200 L 204 215 L 219 200"
          fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>